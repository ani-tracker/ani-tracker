[package]
name = "ani-tracker-tauri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Ani Tracker Tauri 2 application host"

[lib]
name = "ani_tracker_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ani-contracts = { path = "../crates/ani-contracts" }
ani-domain = { path = "../crates/ani-domain" }
ani-repository = { path = "../crates/ani-repository" }
ani-storage = { path = "../crates/ani-storage" }
log = "0.4"
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
url = "2"

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
open = "5"
