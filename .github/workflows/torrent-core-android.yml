name: Android Application Packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  arm64:
    name: android-arm64-v8a
    runs-on: ubuntu-22.04
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    outputs:
      release_signed: ${{ steps.signing.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect release signing
        id: signing
        shell: bash
        run: |
          if [[ -n "${ANDROID_KEYSTORE_BASE64}" ]]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        run: |
          sdkmanager "platforms;android-35" "ndk;27.2.12479018" "cmake;3.31.1"

      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: "2025.06.13"
          path: .vcpkg

      - name: Bootstrap vcpkg
        run: ./.vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Build Android native dependencies
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
        run: bash ./scripts/prepare-android-torrent-dependencies.sh

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build executable debug APK and torrent-host AAR
        env:
          ANI_ANDROID_NATIVE_PREFIX: ${{ github.workspace }}/.cache/android-torrent/vcpkg_installed/arm64-android
        run: gradle -p android :app:assembleDebug :torrent-host:assembleRelease --stacktrace

      - name: Restore Android release keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/ani-tracker-release.jks"

      - name: Build release APK and AAB
        env:
          ANI_ANDROID_NATIVE_PREFIX: ${{ github.workspace }}/.cache/android-torrent/vcpkg_installed/arm64-android
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/ani-tracker-release.jks
        run: gradle -p android :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Verify native ABIs and VLC notices
        shell: bash
        run: |
          aar="android/torrent-host/build/outputs/aar/torrent-host-release.aar"
          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          unzip -l "${aar}" | grep "jni/arm64-v8a/libani_torrent_core.so"
          unzip -l "${aar}" | grep "assets/libtorrent-BSD-3-Clause.txt"
          unzip -l "${aar}" | grep "assets/openssl-Apache-2.0.txt"
          unzip -l "${aar}" | grep "assets/boost-BSL-1.0.txt"
          unzip -l "${apk}" | grep "lib/arm64-v8a/libani_torrent_core.so"
          ! unzip -l "${aar}" | grep -Ei "remote-renderer|ffmpeg|ffprobe|transcod"
          ! unzip -l "${apk}" | grep -Ei "remote-renderer|ffmpeg|ffprobe|transcod"
          verify_vlc_package() {
            local package="$1"
            local entries
            entries="$(unzip -Z1 "${package}")"
            grep -Eq '(^|/)lib/arm64-v8a/libvlc\.so$' <<< "${entries}"
            grep -Eq '(^|/)lib/arm64-v8a/libvlcjni\.so$' <<< "${entries}"
            grep -Eq '(^|/)lib/arm64-v8a/libc\+\+_shared\.so$' <<< "${entries}"
            grep -Eq '(^|/)assets/licenses/vlc/README\.md$' <<< "${entries}"
            grep -Eq '(^|/)assets/licenses/vlc/SOURCE\.md$' <<< "${entries}"
            grep -Eq '(^|/)assets/licenses/vlc/LGPL-2\.1-only\.json$' <<< "${entries}"
            if grep -Eq '(^|/)lib/(armeabi-v7a|x86|x86_64)/.*vlc' <<< "${entries}"; then
              echo "Unexpected VLC ABI in ${package}" >&2
              return 1
            fi
          }
          verify_vlc_package "${apk}"
          while IFS= read -r package; do
            verify_vlc_package "${package}"
          done < <(find android/app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) ! -path '*debug*')

      - uses: actions/upload-artifact@v4
        with:
          name: torrent-host-android-arm64-v8a
          path: android/torrent-host/build/outputs/aar/torrent-host-release.aar
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ani-tracker-android-arm64-v8a-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        with:
          name: ani-tracker-android-arm64-v8a-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  publish-draft:
    name: Publish Android application draft
    if: ${{ startsWith(github.ref, 'refs/tags/') && needs.arm64.outputs.release_signed == 'true' }}
    needs: arm64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ani-tracker-android-arm64-v8a-release
          path: release-assets

      - name: Generate Android SHA-256 checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS-android.txt

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: release-assets/*
