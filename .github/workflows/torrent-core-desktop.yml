name: Desktop Application Packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  unix:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: linux-x64
            platform: linux
            arch: x64
            builderTarget: linux
          - runner: macos-15-intel
            target: darwin-x64
            platform: darwin
            arch: x64
            builderTarget: mac
          - runner: macos-15
            target: darwin-arm64
            platform: darwin
            arch: arm64
            builderTarget: mac
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0

      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: ${{ matrix.platform == 'linux' && 'linux' || 'mac' }}
          target: desktop
          arch: ${{ matrix.platform == 'linux' && 'linux_gcc_64' || 'clang_64' }}
          cache: true

      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: "2025.06.13"
          path: .vcpkg

      - uses: actions/cache@v4
        with:
          path: |
            .vcpkg/downloads
            .vcpkg/buildtrees
            .vcpkg/packages
            .vcpkg/installed
            .cache/qbittorrent-build/downloads
            .cache/libvlc
          key: desktop-native-${{ runner.os }}-${{ matrix.arch }}-2025.06.13-vlc-3.0.21-${{ hashFiles('native/torrent-dependencies/vcpkg.json') }}

      - name: Bootstrap qBittorrent vcpkg
        run: ./.vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Install JavaScript dependencies
        shell: bash
        env:
          SKIP_EVP_NATIVE_REBUILD: "1"
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Verify runner architecture
        shell: bash
        run: |
          expected="${{ matrix.arch }}"
          actual="$(node -p 'process.arch')"
          test "${actual}" = "${expected}"

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-system-dev libssl-dev libx11-dev ninja-build patchelf pax-utils vlc

      - name: Install macOS build dependencies
        if: matrix.platform == 'darwin'
        run: brew install boost openssl@3 ninja

      - name: Prepare libVLC runtime
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == "linux" ]]; then
            raw_version="$(dpkg-query -W -f='${Version}' vlc)"
            vlc_version="${raw_version#*:}"
            source_page="https://launchpad.net/ubuntu/+source/vlc/${raw_version}"
            node scripts/prepare-libvlc-resources.mjs \
              --platform linux \
              --arch "${{ matrix.arch }}" \
              --version "${vlc_version}" \
              --source /usr/lib/x86_64-linux-gnu \
              --shared-data /usr/share/vlc \
              --license-root /usr/share/common-licenses \
              --source-url "https://packages.ubuntu.com/jammy/vlc" \
              --source-code-url "${source_page}" \
              --target out/libvlc \
              --required
          else
            node scripts/download-libvlc-archive.mjs \
              --platform darwin \
              --arch "${{ matrix.arch }}"
            node scripts/download-libvlc-archive.mjs --source-code
            archive=".cache/libvlc/3.0.21/vlc-3.0.21-${{ matrix.arch == 'arm64' && 'arm64' || 'intel64' }}.dmg"
            source_archive=".cache/libvlc/3.0.21/vlc-3.0.21.tar.xz"
            mount_point="${RUNNER_TEMP}/ani-vlc-mount"
            license_root="${RUNNER_TEMP}/ani-vlc-license"
            mkdir -p "${mount_point}" "${license_root}"
            tar -xf "${source_archive}" \
              --strip-components=1 \
              -C "${license_root}" \
              vlc-3.0.21/COPYING \
              vlc-3.0.21/COPYING.LIB
            hdiutil attach "${archive}" -nobrowse -readonly -mountpoint "${mount_point}"
            trap 'hdiutil detach "${mount_point}"' EXIT
            node scripts/prepare-libvlc-resources.mjs \
              --platform darwin \
              --arch "${{ matrix.arch }}" \
              --source "${mount_point}/VLC.app/Contents/MacOS" \
              --license-root "${license_root}" \
              --target out/libvlc \
              --required
            hdiutil detach "${mount_point}"
            trap - EXIT
          fi

      - name: Rebuild Electron native modules
        shell: bash
        run: |
          pnpm exec electron-rebuild -f \
            --only better-sqlite3,electron-vlc-player \
            -a "${{ matrix.arch }}"
          test -s node_modules/electron-vlc-player/build/Release/vlc_binding.node
          ELECTRON_RUN_AS_NODE=1 pnpm exec electron \
            scripts/smoke-libvlc-runtime.cjs \
            "out/libvlc/${{ matrix.target }}"

      - name: Configure portable core
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == "darwin" ]]; then
            export CMAKE_PREFIX_PATH="$(brew --prefix boost);$(brew --prefix openssl@3)"
          fi
          cmake --preset portable-release -S native/torrent-core

      - name: Build portable core
        run: cmake --build native/torrent-core/build/portable-release --config Release

      - name: Stage and verify bundle
        shell: bash
        run: |
          node scripts/package-torrent-core-bundle.mjs --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}"
          node scripts/prepare-torrent-core-resources.mjs \
            --source artifacts/torrent-core \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --required \
            --verify-only

      - name: Build and verify qBittorrent-nox
        shell: bash
        env:
          VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
        run: |
          ./scripts/build-qbittorrent-nox-unix.sh \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}"

      - name: Build Electron application
        shell: bash
        run: |
          pnpm exec electron-vite build
          node scripts/prepare-torrent-core-resources.mjs \
            --source artifacts/torrent-core \
            --target out/torrent-core \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --required
          if [[ "${{ matrix.platform }}" == "linux" ]]; then
            echo "[ffmpeg] linux-x64 使用系统 PATH 中的 ffmpeg/ffprobe"
          else
            pnpm run prepare:ffmpeg
          fi
          node scripts/prepare-qbittorrent-resources.mjs \
            --source artifacts/qbittorrent \
            --target out/qbittorrent \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --required

      - name: Package desktop application
        env:
          ANI_PACKAGE_PLATFORM: ${{ matrix.platform }}
          ANI_PACKAGE_ARCH: ${{ matrix.arch }}
          CSC_LINK: ${{ matrix.platform == 'darwin' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'darwin' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.platform == 'darwin' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'darwin' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'darwin' && secrets.APPLE_TEAM_ID || '' }}
        run: pnpm exec electron-builder --config electron-builder.config.cjs --${{ matrix.builderTarget }} --${{ matrix.arch }} --publish never

      - name: Verify packaged native resources
        shell: bash
        run: |
          core="$(find release -type f -path "*/torrent-core/${{ matrix.target }}/torrent-core" -print -quit)"
          test -n "${core}"
          test -x "${core}"
          if [[ "${{ matrix.platform }}" == "darwin" ]]; then
            qbittorrent="$(find release -type f -path "*/qbittorrent/${{ matrix.target }}/qbittorrent-nox.app/Contents/MacOS/qbittorrent-nox" -print -quit)"
          else
            qbittorrent="$(find release -type f -path "*/qbittorrent/${{ matrix.target }}/qbittorrent-nox" -print -quit)"
          fi
          test -n "${qbittorrent}"
          test -x "${qbittorrent}"
          qbittorrent_root="$(dirname "${qbittorrent}")"
          if [[ "${{ matrix.platform }}" == "darwin" ]]; then
            qbittorrent_root="$(dirname "$(dirname "$(dirname "${qbittorrent_root}")")")"
          fi
          test -f "${qbittorrent_root}/manifest.json"
          node scripts/verify-qbittorrent-bundle.mjs \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --directory "${qbittorrent_root}"
          verify_args=(
            --root release
            --platform "${{ matrix.platform }}"
            --arch "${{ matrix.arch }}"
          )
          if [[ "${{ matrix.platform }}" == "linux" ]]; then
            verify_args+=(--check-dynamic)
          fi
          node scripts/verify-libvlc-package.mjs "${verify_args[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: torrent-core-${{ matrix.target }}
          path: artifacts/torrent-core/${{ matrix.target }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: qbittorrent-nox-${{ matrix.target }}
          path: artifacts/qbittorrent-packages/qbittorrent-nox-${{ matrix.target }}.tar.gz
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: matrix.target == 'linux-x64'
        with:
          name: qbittorrent-nox-sources
          path: |
            .cache/qbittorrent-build/downloads/qbittorrent-enhanced-5.2.1.10.tar.gz
            .cache/qbittorrent-build/downloads/libtorrent-rasterbar-2.0.13.tar.gz
          include-hidden-files: true
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ani-tracker-${{ matrix.target }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  windows:
    name: win32-x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0

      - uses: ilammy/msvc-dev-cmd@v1

      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: "2025.06.13"
          path: .vcpkg

      - uses: actions/cache@v4
        with:
          path: |
            .vcpkg/downloads
            .vcpkg/buildtrees
            .vcpkg/packages
            .vcpkg/installed
            .cache/qbittorrent-build/downloads
            .cache/libvlc
          key: desktop-native-${{ runner.os }}-x64-2025.06.13-vlc-3.0.21-${{ hashFiles('native/torrent-dependencies/vcpkg.json') }}

      - name: Bootstrap qBittorrent vcpkg
        shell: pwsh
        run: ./.vcpkg/bootstrap-vcpkg.bat -disableMetrics

      - name: Install JavaScript dependencies
        shell: pwsh
        env:
          SKIP_EVP_NATIVE_REBUILD: "1"
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Prepare libVLC runtime
        shell: pwsh
        run: |
          node scripts/download-libvlc-archive.mjs --platform win32 --arch x64
          $archive = ".cache\libvlc\3.0.21\vlc-3.0.21-win64.zip"
          $extractRoot = Join-Path "${{ runner.temp }}" "ani-vlc"
          Expand-Archive -LiteralPath $archive -DestinationPath $extractRoot
          node scripts/prepare-libvlc-resources.mjs `
            --platform win32 `
            --arch x64 `
            --source (Join-Path $extractRoot "vlc-3.0.21") `
            --target out/libvlc `
            --required

      - name: Rebuild Electron native modules
        shell: pwsh
        run: |
          pnpm exec electron-rebuild -f --only better-sqlite3 -a x64
          pnpm exec electron-rebuild -f --module-dir node_modules/electron-vlc-player -a x64
          $binding = "node_modules\electron-vlc-player\build\Release\vlc_binding.node"
          if (-not (Test-Path $binding -PathType Leaf) -or (Get-Item $binding).Length -eq 0) {
            throw "electron-vlc-player binding was not rebuilt"
          }
          $env:ELECTRON_RUN_AS_NODE = "1"
          pnpm exec electron scripts/smoke-libvlc-runtime.cjs out\libvlc\win32-x64

      - name: Install static dependencies
        shell: pwsh
        run: |
          & "${{ github.workspace }}\.vcpkg\vcpkg.exe" install `
            --triplet=x64-windows-static `
            --x-manifest-root="${{ github.workspace }}\native\torrent-dependencies" `
            --x-install-root="${{ github.workspace }}\.vcpkg\installed"

      - name: Configure portable core
        shell: pwsh
        run: |
          cmake --preset portable-release -S native/torrent-core `
            "-DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/.vcpkg/scripts/buildsystems/vcpkg.cmake" `
            "-DVCPKG_TARGET_TRIPLET=x64-windows-static" `
            "-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded"

      - name: Build portable core
        run: cmake --build native/torrent-core/build/portable-release --config Release

      - name: Stage and verify bundle
        shell: pwsh
        run: |
          node scripts/package-torrent-core-bundle.mjs --platform win32 --arch x64
          node scripts/prepare-torrent-core-resources.mjs --source artifacts/torrent-core --platform win32 --arch x64 --required --verify-only

      - name: Build and verify qBittorrent-nox
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ github.workspace }}\.vcpkg
        run: ./scripts/build-qbittorrent-nox-windows.ps1 -Arch x64

      - name: Build Electron application
        shell: pwsh
        run: |
          pnpm exec electron-vite build
          node scripts/prepare-torrent-core-resources.mjs --source artifacts/torrent-core --target out/torrent-core --platform win32 --arch x64 --required
          pnpm run prepare:ffmpeg
          node scripts/prepare-qbittorrent-resources.mjs --source artifacts/qbittorrent --target out/qbittorrent --platform win32 --arch x64 --required

      - name: Package desktop application
        shell: pwsh
        env:
          ANI_PACKAGE_PLATFORM: win32
          ANI_PACKAGE_ARCH: x64
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: pnpm exec electron-builder --config electron-builder.config.cjs --win --x64 --publish never

      - name: Verify packaged native resources
        shell: pwsh
        run: |
          $core = Get-ChildItem -Path release -Recurse -Filter torrent-core.exe |
            Where-Object { $_.FullName -like "*torrent-core\win32-x64\torrent-core.exe" } |
            Select-Object -First 1
          if (-not $core) {
            throw "Packaged torrent-core.exe was not found"
          }
          $qbittorrent = Get-ChildItem -Path release -Recurse -Filter qbittorrent-nox.exe |
            Where-Object { $_.FullName -like "*qbittorrent\win32-x64\qbittorrent-nox.exe" } |
            Select-Object -First 1
          if (-not $qbittorrent) {
            throw "Packaged qbittorrent-nox.exe was not found"
          }
          $qbittorrentManifest = Join-Path $qbittorrent.DirectoryName "manifest.json"
          if (-not (Test-Path $qbittorrentManifest -PathType Leaf)) {
            throw "Packaged qBittorrent manifest.json was not found"
          }
          node scripts/verify-qbittorrent-bundle.mjs `
            --platform win32 `
            --arch x64 `
            --directory $qbittorrent.DirectoryName
          node scripts/verify-libvlc-package.mjs --root release --platform win32 --arch x64

      - uses: actions/upload-artifact@v4
        with:
          name: torrent-core-win32-x64
          path: artifacts/torrent-core/win32-x64
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: qbittorrent-nox-win32-x64
          path: artifacts/qbittorrent-packages/qbittorrent-nox-win32-x64.tar.gz
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ani-tracker-win32-x64
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error

  publish-draft:
    name: Publish desktop application draft
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: [unix, windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ani-tracker-*
          path: release-assets
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: qbittorrent-nox-*
          path: release-assets
          merge-multiple: true

      - name: Generate desktop SHA-256 checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS-desktop.txt

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: release-assets/*
