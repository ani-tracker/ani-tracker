name: iOS VLC Player Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    paths:
      - "ios/**"
      - "crates/tauri-plugin-ani-player/ios/**"
      - "scripts/prepare-ios-libvlc.sh"
      - "resources/licenses/vlc/**"
      - "resources/ffmpeg/licenses/LGPL-2.1-only.json"
      - ".github/workflows/ios-player.yml"
  pull_request:
    paths:
      - "ios/**"
      - "crates/tauri-plugin-ani-player/ios/**"
      - "scripts/prepare-ios-libvlc.sh"
      - "resources/licenses/vlc/**"
      - "resources/ffmpeg/licenses/LGPL-2.1-only.json"
      - ".github/workflows/ios-player.yml"

permissions:
  contents: read

jobs:
  simulator:
    name: ios-simulator-and-device
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app

      - name: Install iOS project tools
        run: brew install xcodegen cocoapods

      - name: Generate project and install MobileVLCKit
        working-directory: ios
        run: |
          xcodegen generate
          pod install --repo-update

      - name: Run iOS simulator tests
        working-directory: ios
        run: |
          destination_id="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(device["udid"] for runtime in devices.values() for device in runtime if "iPhone" in device["name"]))
          ')"
          xcodebuild \
            -workspace AniTracker.xcworkspace \
            -scheme AniTracker \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${destination_id}" \
            -derivedDataPath "${RUNNER_TEMP}/AniTrackerDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Verify MobileVLCKit embedding
        run: |
          app="${RUNNER_TEMP}/AniTrackerDerivedData/Build/Products/Debug-iphonesimulator/Ani Tracker.app"
          test -x "${app}/Ani Tracker"
          test -f "${app}/Frameworks/MobileVLCKit.framework/MobileVLCKit"
          file "${app}/Frameworks/MobileVLCKit.framework/MobileVLCKit"
          test -n "$(find "${app}" -type f -path '*/vlc/README.md' -print -quit)"
          test -n "$(find "${app}" -type f -path '*/vlc/SOURCE.md' -print -quit)"
          test -n "$(find "${app}" -type f -name 'LGPL-2.1-only.json' -print -quit)"

      - name: Build unsigned arm64 device application
        working-directory: ios
        run: |
          xcodebuild \
            -workspace AniTracker.xcworkspace \
            -scheme AniTracker \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "${RUNNER_TEMP}/AniTrackerDeviceDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify arm64 MobileVLCKit and notices
        run: |
          app="${RUNNER_TEMP}/AniTrackerDeviceDerivedData/Build/Products/Release-iphoneos/Ani Tracker.app"
          framework="${app}/Frameworks/MobileVLCKit.framework/MobileVLCKit"
          test -x "${app}/Ani Tracker"
          test -f "${framework}"
          lipo -archs "${framework}" | grep -qw arm64
          test -n "$(find "${app}" -type f -path '*/vlc/README.md' -print -quit)"
          test -n "$(find "${app}" -type f -path '*/vlc/SOURCE.md' -print -quit)"
          test -n "$(find "${app}" -type f -name 'LGPL-2.1-only.json' -print -quit)"

      - name: Package iOS artifacts
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "${RUNNER_TEMP}/AniTrackerDerivedData/Build/Products/Debug-iphonesimulator/Ani Tracker.app" \
            "${RUNNER_TEMP}/AniTracker-iOS-Simulator.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            "${RUNNER_TEMP}/AniTrackerDeviceDerivedData/Build/Products/Release-iphoneos/Ani Tracker.app" \
            "${RUNNER_TEMP}/AniTracker-iOS-Device-Unsigned.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ani-tracker-ios-vlc-builds
          path: |
            ${{ runner.temp }}/AniTracker-iOS-Simulator.zip
            ${{ runner.temp }}/AniTracker-iOS-Device-Unsigned.zip
          if-no-files-found: error
